<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Confirmation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            padding: 20px;
            background-color:#001d3d;
        }
        
        .navbar {
            background-color: blue;
            border: 2px solid #333;
            padding: 10px;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .navbar a {
            color: white;
            text-decoration: none;
            padding: 0 20px;
            font-weight: bold;
        }
        
        .container {
            display: flex;
            gap: 30px;
            max-width: 1200px;
        }
        
        .image-section {
            flex: 0 0 200px;
        }
        
        .image-box {
            width: 200px;
            height: 200px;
            border: 2px solid black;
            background-color: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .image-box svg {
            width: 150px;
            height: 150px;
        }
        
        .form-section {
            flex: 1;
        }
        
        .info-group {
            margin-bottom: 20px;
        }
        
        .info-label {
            display: inline-block;
            width: 180px;
            font-weight: bold;
        }
        
        .info-value {
            display: inline-block;
        }
        
        .info-box {
            background-color: white;
            border: 2px solid black;
            padding: 8px;
            display: inline-block;
            min-width: 400px;
        }
        
        .description-box {
            background-color: white;
            border: 2px solid black;
            padding: 8px;
            min-width: 400px;
            min-height: 60px;
            white-space: pre-line;
        }
        
        .checkbox-group {
            margin-left: 180px;
            margin-top: 10px;
        }
        
        .checkbox-group label {
            margin-right: 20px;
        }
        
        input[type="checkbox"] {
            margin-right: 5px;
        }
        
        input[type="text"] {
            width: 400px;
            padding: 8px;
            border: 2px solid black;
            background-color: white;
        }
        
        select {
            width: 200px;
            padding: 8px;
            border: 2px solid black;
            background-color: white;
        }
        
        .pay-btn {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px 30px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }
        
        .pay-btn:hover {
            background-color: #218838;
        }
        
        .button-container {
            text-align: center;
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="praktikum3aa.html">Home</a> |
        <a href="#">Register</a> |
        <a href="#">Policy</a> |
        <a href="#">About</a>
    </div>
    
    <div class="container">
        <div class="image-section">
            <div class="image-box">
                <svg viewBox="0 0 100 100">
                    <line x1="10" y1="10" x2="90" y2="90" stroke="black" stroke-width="2"/>
                    <line x1="90" y1="10" x2="10" y2="90" stroke="black" stroke-width="2"/>
                </svg>
            </div>
        </div>
        
        <div class="form-section">
            <div class="info-group">
                <span class="info-label" style="color: white">Title Here :</span>
                <span class="info-value" id="displayTitle" style="color: white"></span>
            </div>
            
            <div class="info-group">
                <span class="info-label" style="color: white">Description :</span>
                <div class="description-box" id="displayDescription"></div>
            </div>
            
            <div class="info-group">
                <span class="info-label" style="color: white">Total Amount :</span>
                <span class="info-value" id="displayAmount" style="color: white"></span>
            </div>
            
            <div class="info-group">
                <span class="info-label" style="color: white">Pay to :</span>
                <span class="info-value" id="displayPayTo" style="color: white"></span>
            </div>
            
            <div class="info-group">
                <span class="info-label" style="color: white">Payment Type :</span>
                <select id="paymentType">
                    <option value="Visa Debit">Visa Debit</option>
                    <option value="Visa Credit">Visa Credit</option>
                    <option value="MasterCard">MasterCard</option>
                    <option value="Bank Transfer">Bank Transfer</option>
                </select>
            </div>
            
            <div class="info-group">
                <span class="info-label" style="color: white">Account Holder :</span>
                <input type="text" id="payerName" placeholder="Name Here">
            </div>
            
            <div class="info-group">
                <span class="info-label" style="color: white">Account No :</span>
                <input type="text" id="payerAccount" placeholder="123-456-789-0">
            </div>
            
            <div class="checkbox-group">
                    <div>
                        <input type="checkbox" id="sendMobile">
                        <label for="sendMobile" style="color: white">Send to Mobile Phone</label>
                    </div>
                    <div>
                        <input type="checkbox" id="sendEmail">
                        <label for="sendEmail" style="color: white">Send to Email</label>
                    </div>
            </div>
            
            <div class="info-group">
                <span class="info-label" style="color: white">Send to Mobile Phone :</span>
                <input type="text" id="displayMobile" readonly>
            </div>
            
            <div class="info-group">
                <span class="info-label" style="color: white">Send to Email :</span>
                <input type="text" id="displayEmail" readonly>
            </div>
            
            <div class="button-container">
                <button class="pay-btn" onclick="processPayment()">Pay using QuickLink</button>
            </div>
        </div>
    </div>
    
    <script>
        // Ambil data dari localStorage
        window.onload = function() {
            const data = JSON.parse(localStorage.getItem('paymentData'));
            
            if (data) {
                document.getElementById('displayTitle').textContent = data.title;
                document.getElementById('displayDescription').textContent = data.description;
                
                // Extract amount from title (£800)
                const amountMatch = data.title.match(/£(\d+)/);
                document.getElementById('displayAmount').textContent = amountMatch ? '£' + amountMatch[1] : '';
                
                document.getElementById('displayPayTo').textContent = data.accountNumber;
                document.getElementById('displayMobile').value = data.mobilePhone;
                document.getElementById('displayEmail').value = data.email;
            }
        }
        
        function processPayment() {
            const payerName = document.getElementById('payerName').value;
            const payerAccount = document.getElementById('payerAccount').value;
            const paymentType = document.getElementById('paymentType').value;
            
            if (!payerName || !payerAccount) {
                alert('Please fill in all payment details!');
                return;
            }
            
            alert('Payment processing...\n\nPayer: ' + payerName + '\nAccount: ' + payerAccount + '\nPayment Type: ' + paymentType);
        }
    </script>
</body>
</html>
