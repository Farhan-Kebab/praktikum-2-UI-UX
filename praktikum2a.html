<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate Payment Link</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            padding: 20px;
            background-color:#001d3d;
        }
        
        .navbar {
            background-color: blue;
            border: 2px solid #333;
            padding: 10px;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .navbar a {
            text-decoration: none;
            color: #333;
            margin: 0 20px;
            font-weight: bold;
        }
        
        .container {
            display: flex;
            gap: 30px;
            max-width: 1200px;
        }
        
        .image-upload {
            flex: 0 0 200px;
        }
        
        .image-box {
            width: 200px;
            height: 200px;
            border: 2px solid #333;
            background-color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
            position: relative;
        }
        
        .image-box::before,
        .image-box::after {
            content: '';
            position: absolute;
            width: 180px;
            height: 2px;
            background-color: #333;
        }
        
        .image-box::before {
            transform: rotate(45deg);
        }
        
        .image-box::after {
            transform: rotate(-45deg);
        }
        
        .upload-btn {
            background-color: #e0e0e0;
            border: 2px solid #333;
            padding: 8px 20px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .form-section {
            flex: 1;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .transaction {
            margin-bottom: 15px;
        }
        
        label {
            display: inline-block;
            width: 150px;
            font-weight: bold;
        }
        
        input[type="text"],
        select,
        textarea {
            width: 400px;
            padding: 8px;
            border: 2px solid #333;
            font-size: 14px;
        }
        
        textarea {
            height: 80px;
            resize: vertical;
        }
        
        select {
            width: 420px;
        }
        
        .note {
            font-size: 12px;
            color: #666;
            margin-left: 150px;
            margin-top: 5px;
        }
        
        .checkbox-group {
            margin: 20px 0;
            margin-left: 150px;
        }
        
        .checkbox-group label {
            width: auto;
            margin-left: 5px;
        }
        
        .checkbox-group div {
            margin-bottom: 8px;
        }
        
        .generate-btn {
            background-color: #ffd60a;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-left: 150px;
            margin-top: 20px;
        }
        
        .generate-btn:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="#" style="color: white">Home</a> |
        <a href="#" style="color: white">Generate Link</a> |
        <a href="#" style="color: white">Transaction History</a> |
        <a href="#" style="color: white">Policy</a> |
        <a href="#" style="color: white">Logout</a>
    </div>

    <div class="container">
        <div class="image-upload">
            <div class="image-box"></div>
            <button class="upload-btn">Upload Picture</button>
        </div>

        <div class="form-section">
            <form id="paymentForm">
                <div class="form-group">
                    <label style="color: white">Product:</label>
                    <input type="text" id="title" placeholder="Item Name">
                </div>

                <div class="form-group">
                    <label style="color: white">Description :</label>
                    <textarea id="description" placeholder="Color and Model"></textarea>
                </div>

                <div class="form-group">
                    <label style="color: white">Account Number :</label>
                    <input type="text" id="accountNumber" placeholder="ex: 1234567890">
                </div>

                <div class="form-group">
                    <label style="color: white">Bank :</label>
                    <select id="bank">
                        <option value="Other">Other</option>
                        <option value="HSBC">HSBC</option>
                        <option value="Barclays">Barclays</option>
                        <option value="Lloyds">Lloyds</option>
                        <option value="NatWest">NatWest</option>
                    </select>
                </div>

                <div class="form-group">
                    <label style="color: white">Account Holder :</label>
                    <input type="text" id="accountHolder" placeholder="Name Here">
                </div>

                <div class="transaction">
                    <label style="color: white">Transaction :</label>
                    <select id="transaction">
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                    </select>
                </div>
                <div class="note" style="color: white">* if the transaction is for 3 person, choose 3 from the drop-down list</div>

                <div class="checkbox-group">
                    <div>
                        <input type="checkbox" id="sendMobile">
                        <label for="sendMobile" style="color: white">Send to Mobile Phone</label>
                    </div>
                    <div>
                        <input type="checkbox" id="sendEmail">
                        <label for="sendEmail" style="color: white">Send to Email</label>
                    </div>
                </div>

                <div class="form-group">
                    <label style="color: white">Send to Mobile Phone :</label>
                    <input type="text" id="mobileNumbers" placeholder="088844442222">
                </div>

                <div class="form-group">
                    <label style="color: white">Send to Email :</label>
                    <input type="text" id="emails" placeholder="qwerty@asdfgh.com">
                </div>

                <button type="button" class="generate-btn" onclick="generateLink()">Buy</button>
            </form>
        </div>
    </div>

    <script>
        function generateLink() {
            const title = document.getElementById('title').value;
            const description = document.getElementById('description').value;
            const accountNumber = document.getElementById('accountNumber').value;
            const bank = document.getElementById('bank').value;
            const accountHolder = document.getElementById('accountHolder').value;
            const transaction = document.getElementById('transaction').value;
            const mobileNumbers = document.getElementById('mobileNumbers').value;
            const emails = document.getElementById('emails').value;
            
            // Simpan data ke localStorage
            const paymentData = {
                title,
                description,
                accountNumber,
                bank,
                accountHolder,
                transaction,
                mobileNumbers,
                emails,
                totalAmount: '£800'
            };
            
            const dataStr = encodeURIComponent(JSON.stringify(paymentData));
            window.location.href = 'praktikum2b.html?data=' + dataStr;
        }
    </script>
</body>
</html>
